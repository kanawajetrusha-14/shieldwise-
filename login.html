<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#07152f">

    <title>Login | ShieldWise</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">

    <script src="js/theme.js" defer></script>
    <script src="js/auth.js" defer></script>
</head>

<body class="auth-page">

    <!-- NAVBAR -->

    <header class="navbar">

        <a href="index.html" class="brand">
            <div class="brand-shield">🛡️</div>
            <span>ShieldWise</span>
        </a>

        <div class="nav-actions">

            <button
                class="theme-toggle"
                onclick="toggleTheme()"
                aria-label="Toggle theme">
                ☀️ <span>◐</span>
            </button>

            <a href="signup.html" class="login-btn">
                Sign Up
            </a>

        </div>

    </header>


    <!-- LOGIN AREA -->

    <main class="auth-container">

        <div class="auth-decoration left-decoration">
            🔒
        </div>

        <div class="auth-decoration right-decoration">
            🛡️
        </div>


        <div class="auth-card">

            <!-- BRAND -->

            <div class="auth-brand">

                <div class="auth-logo">
                    🛡️
                </div>

                <h1>ShieldWise</h1>

            </div>


            <h2>Welcome Back!</h2>

            <p class="auth-subtitle">
                Login to continue your safety journey
            </p>


            <!-- LOGIN FORM -->

            <form id="loginForm">

                <div class="form-group">

                    <label for="loginEmail">
                        Email or Username
                    </label>

                    <div class="input-wrapper">

                        <span>✉️</span>

                        <input
                            type="text"
                            id="loginEmail"
                            placeholder="Enter your email or username"
                            required>

                    </div>

                </div>


                <div class="form-group">

                    <label for="loginPassword">
                        Password
                    </label>

                    <div class="input-wrapper">

                        <span>🔒</span>

                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Enter your password"
                            required>

                        <button
                            type="button"
                            class="password-toggle"
                            onclick="togglePassword('loginPassword', this)">
                            👁
                        </button>

                    </div>

                </div>


                <div class="remember-row">

                    <label class="remember">

                        <input type="checkbox" id="rememberMe">

                        <span>Remember me</span>

                    </label>

                    <a href="#" onclick="forgotPassword(event)">
                        Forgot password?
                    </a>

                </div>


                <button type="submit" class="auth-submit">
                    Login
                </button>

                <p id="loginMessage" class="form-message"></p>

            </form>


            <div class="auth-divider">
                <span>Don't have an account?</span>
            </div>


            <p class="auth-bottom">
                Don't have an account?
                <a href="signup.html">Sign Up</a>
            </p>

        </div>

    </main>


    <!-- FOOTER -->

    <footer class="footer">
        🛡️ <strong>ShieldWise</strong>
        <br>
        Phishing Scam Online Fraud Awareness System
    </footer>

</body>
</html>
